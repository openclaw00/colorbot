<svg xmlns="http://www.w3.org/2000/svg" width="545" height="525" viewBox="0 0 545 525">
  <rect width="545" height="525" fill="#f8f8f8"/>
  <rect x="0.5" y="0.5" width="544" height="524" fill="#f8f8f8" stroke="#9a9a9a"/>
  <rect x="0.5" y="0.5" width="544" height="34" fill="#ffffff" stroke="#d0d0d0"/>
  <text x="14" y="23" font-family="Segoe UI, Arial" font-size="13" fill="#111">ColorBot</text>

  <text x="20" y="46" font-family="Segoe UI, Arial" font-size="23" font-weight="600" fill="#111">ColorBot</text>
  <text x="230" y="43" font-family="Segoe UI, Arial" font-size="14" fill="#333">OFF - click START or press F8</text>

  <text x="24" y="78" font-family="Segoe UI, Arial" font-size="14" fill="#222">Color to watch</text>
  <rect x="160" y="58" width="220" height="30" rx="2" fill="#fff" stroke="#777"/>
  <text x="170" y="78" font-family="Segoe UI, Arial" font-size="14" fill="#111">Yellow outline</text>
  <path d="M360 69 l8 8 l8 -8" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="400" y="59" width="46" height="28" fill="#ffe600" stroke="#777"/>

  <text x="24" y="124" font-family="Segoe UI, Arial" font-size="14" fill="#222">Key to press</text>
  <rect x="160" y="104" width="100" height="30" rx="2" fill="#fff" stroke="#777"/>
  <text x="170" y="124" font-family="Segoe UI, Arial" font-size="14" fill="#111">F</text>
  <text x="280" y="124" font-family="Segoe UI, Arial" font-size="13" fill="#444">Examples: F, E, SPACE, SHIFT, CTRL</text>

  <text x="24" y="170" font-family="Segoe UI, Arial" font-size="14" fill="#222">Reaction delay</text>
  <rect x="160" y="150" width="100" height="30" rx="2" fill="#fff" stroke="#777"/>
  <text x="170" y="170" font-family="Segoe UI, Arial" font-size="14" fill="#111">0</text>
  <text x="280" y="170" font-family="Segoe UI, Arial" font-size="13" fill="#444">ms before pressing after color appears</text>

  <text x="24" y="216" font-family="Segoe UI, Arial" font-size="14" fill="#222">Press interval</text>
  <rect x="160" y="196" width="100" height="30" rx="2" fill="#fff" stroke="#777"/>
  <text x="170" y="216" font-family="Segoe UI, Arial" font-size="14" fill="#111">25</text>
  <text x="280" y="216" font-family="Segoe UI, Arial" font-size="13" fill="#444">ms between presses while visible</text>

  <text x="24" y="262" font-family="Segoe UI, Arial" font-size="14" fill="#222">Detection</text>
  <rect x="160" y="242" width="220" height="30" rx="2" fill="#fff" stroke="#777"/>
  <text x="170" y="262" font-family="Segoe UI, Arial" font-size="14" fill="#111">Normal</text>
  <path d="M360 253 l8 8 l8 -8" fill="none" stroke="#333" stroke-width="1.5"/>

  <text x="24" y="308" font-family="Segoe UI, Arial" font-size="14" fill="#222">Scan box size</text>
  <rect x="160" y="288" width="70" height="30" rx="2" fill="#fff" stroke="#777"/>
  <text x="170" y="308" font-family="Segoe UI, Arial" font-size="14" fill="#111">40</text>
  <text x="238" y="308" font-family="Segoe UI, Arial" font-size="14" fill="#222">x</text>
  <rect x="260" y="288" width="70" height="30" rx="2" fill="#fff" stroke="#777"/>
  <text x="270" y="308" font-family="Segoe UI, Arial" font-size="14" fill="#111">40</text>
  <text x="350" y="308" font-family="Segoe UI, Arial" font-size="13" fill="#444">pixels, centered on screen</text>

  <text x="24" y="354" font-family="Segoe UI, Arial" font-size="14" fill="#777">Custom RGB</text>
  <rect x="160" y="334" width="54" height="30" rx="2" fill="#eee" stroke="#bbb"/>
  <text x="171" y="354" font-family="Segoe UI, Arial" font-size="13" fill="#777">255</text>
  <rect x="222" y="334" width="54" height="30" rx="2" fill="#eee" stroke="#bbb"/>
  <text x="236" y="354" font-family="Segoe UI, Arial" font-size="13" fill="#777">230</text>
  <rect x="284" y="334" width="54" height="30" rx="2" fill="#eee" stroke="#bbb"/>
  <text x="307" y="354" font-family="Segoe UI, Arial" font-size="13" fill="#777">0</text>
  <rect x="354" y="334" width="70" height="30" rx="3" fill="#eee" stroke="#bbb"/>
  <text x="376" y="354" font-family="Segoe UI, Arial" font-size="13" fill="#777">Pick</text>

  <rect x="110" y="386" width="145" height="44" rx="4" fill="#e9f2ff" stroke="#548ed4"/>
  <text x="159" y="414" font-family="Segoe UI, Arial" font-size="15" font-weight="600" fill="#111">START</text>
  <rect x="275" y="386" width="145" height="44" rx="4" fill="#f2f2f2" stroke="#9d9d9d"/>
  <text x="324" y="414" font-family="Segoe UI, Arial" font-size="15" font-weight="600" fill="#111">STOP</text>

  <text x="140" y="470" font-family="Segoe UI, Arial" font-size="14" fill="#333">Hotkeys: F8 start/stop   F9 stop</text>
</svg>
